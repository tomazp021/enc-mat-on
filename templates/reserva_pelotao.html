<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ENC-MAT · Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #e8f0e8;
            --bg-card: #ffffff;
            --text-primary: #1a2c1a;
            --text-secondary: #4a6a4a;
            --accent: #2d6a4f;
            --accent-hover: #1b4d3e;
            --accent-light: #d4e8d4;
            --border: #c0d4c0;
            --danger: #c44a3a;
            --success: #2a7a4a;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
            --input-bg: #ffffff;
        }

        body.dark {
            --bg-primary: #0a1a0f;
            --bg-card: #1a2a1f;
            --text-primary: #e8f0e8;
            --text-secondary: #a0c0a0;
            --accent: #c9a53b;
            --accent-hover: #dbb84e;
            --accent-light: #2a3a2a;
            --border: #3a5a3a;
            --danger: #d96c5c;
            --success: #5a9a6a;
            --shadow: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-hover: 0 12px 32px rgba(0,0,0,0.5);
            --input-bg: #2a3a2a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease;
            padding: 20px;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .splash-content {
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }
        .splash-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--accent);
            text-transform: uppercase;
            animation: fadeInScale 0.8s ease forwards;
        }
        .splash-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .splash-divider {
            width: 0;
            height: 3px;
            background: var(--accent);
            margin: 1.5rem auto;
            border-radius: 3px;
            animation: expandWidth 0.8s ease 0.2s forwards;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 1.5rem auto;
            opacity: 0;
            animation: spin 0.9s linear infinite, fadeIn 0.3s ease 0.5s forwards;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.8); letter-spacing: 0px; } to { opacity: 1; transform: scale(1); letter-spacing: 6px; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes expandWidth { from { width: 0; opacity: 0; } to { width: 80px; opacity: 1; } }

        /* Login Container */
        .login-container {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .login-container.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s;
            z-index: 100;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .theme-toggle.visible { opacity: 1; }
        .theme-toggle:hover { transform: scale(1.02); border-color: var(--accent); }

        /* Login Card */
        .login-card {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 2.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            background: linear-gradient(135deg, var(--accent-light), var(--bg-card));
            width: 85px;
            height: 85px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent);
        }
        .login-logo i {
            font-size: 2.5rem;
            color: var(--accent);
        }
        .login-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }
        .badge-sys {
            display: inline-block;
            background: var(--accent-light);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.65rem;
            margin-top: 0.8rem;
            font-weight: 500;
            color: var(--accent);
        }

        /* Formulário */
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-icon {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon i {
            position: absolute;
            left: 1rem;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .input-icon input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .input-icon input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(45,106,79,0.2);
        }

        /* Botão Login */
        .btn-login {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            background: var(--accent-hover);
            transform: scale(0.98);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Mensagem de erro */
        .error-msg {
            background: rgba(196,74,58,0.1);
            border-left: 3px solid var(--danger);
            padding: 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            color: var(--danger);
            display: none;
            align-items: center;
            gap: 8px;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
        }

        /* Versão */
        .versao {
            position: fixed;
            bottom: 15px;
            left: 15px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
            box-shadow: var(--shadow);
        }
        .versao.visible { opacity: 0.8; }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
            .login-header h2 { font-size: 1.5rem; }
            .theme-toggle { top: 10px; right: 10px; padding: 0.3rem 1rem; font-size: 0.7rem; }
            .login-logo { width: 70px; height: 70px; }
            .login-logo i { font-size: 2rem; }
            .splash-title { font-size: 2rem; letter-spacing: 4px; }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-title">ENC·MAT</div>
            <div class="splash-divider"></div>
            <div class="splash-sub">Controle de Estoque e Material</div>
            <div class="loader"></div>
            <div class="splash-sub" style="font-size: 0.65rem; margin-top: 0.5rem;">1ª Companhia</div>
        </div>
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
        <span>Modo Escuro</span>
    </button>

    <!-- Versão -->
    <div class="versao" id="versao">
        <i class="fas fa-boxes"></i> ENC-MAT v2.0
    </div>

    <!-- Login Container -->
    <div class="login-container" id="loginContainer">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-boxes"></i>
                </div>
                <h2>ENC·MAT</h2>
                <p>Controle de Estoque e Material</p>
                <div class="badge-sys">
                    <i class="fas fa-shield-alt"></i> LOG permanente · Auditoria total
                </div>
            </div>
            
            <div id="loginError" class="error-msg">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="errorText">Login ou senha inválidos</span>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-user"></i> LOGIN</label>
                <div class="input-icon">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="loginUser" placeholder="Digite seu login" autocomplete="off" autofocus>
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> SENHA</label>
                <div class="input-icon">
                    <i class="fas fa-key"></i>
                    <input type="password" id="loginPassword" placeholder="********">
                </div>
            </div>
            
            <button class="btn-login" id="doLoginBtn">
                <i class="fas fa-arrow-right-to-bracket"></i> ACESSAR SISTEMA
            </button>
            
            <div class="login-footer">
                <i class="fas fa-shield-alt"></i> Sistema restrito ao controle de material<br>
                <span style="font-size: 0.6rem;">DEV | SUB | RESPONSÁVEL | LEITURA</span>
            </div>
        </div>
    </div>

    <script>
        // ==================== SPLASH SCREEN ====================
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            const loginContainer = document.getElementById('loginContainer');
            const themeToggle = document.getElementById('themeToggle');
            const versao = document.getElementById('versao');
            
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    if (loginContainer) loginContainer.classList.add('visible');
                    if (themeToggle) themeToggle.classList.add('visible');
                    if (versao) versao.classList.add('visible');
                }, 600);
            } else {
                if (loginContainer) loginContainer.classList.add('visible');
                if (themeToggle) themeToggle.classList.add('visible');
                if (versao) versao.classList.add('visible');
            }
        }, 2500);

        // ==================== TEMA (DARK/LIGHT) ====================
        function initTheme() {
            const savedTheme = localStorage.getItem('encmat_theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
                updateThemeButton(true);
            } else {
                document.body.classList.remove('dark');
                updateThemeButton(false);
            }
        }

        function updateThemeButton(isDark) {
            const btn = document.getElementById('themeToggle');
            if (btn) {
                if (isDark) {
                    btn.innerHTML = '<i class="fas fa-sun"></i> <span>Modo Claro</span>';
                } else {
                    btn.innerHTML = '<i class="fas fa-moon"></i> <span>Modo Escuro</span>';
                }
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('encmat_theme', isDark ? 'dark' : 'light');
            updateThemeButton(isDark);
        }

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

        // ==================== FUNÇÃO DE LOGIN ====================
        let isLoading = false;

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            const errorText = document.getElementById('errorText');
            if (errorText) errorText.innerText = message;
            if (errorDiv) errorDiv.style.display = 'flex';
            
            // Esconder o erro após 5 segundos
            setTimeout(() => {
                if (errorDiv) errorDiv.style.display = 'none';
            }, 5000);
        }

        function hideError() {
            const errorDiv = document.getElementById('loginError');
            if (errorDiv) errorDiv.style.display = 'none';
        }

        async function fazerLogin(login, senha) {
            hideError();
            
            if (!login || !login.trim()) {
                showError('Preencha o campo de login!');
                return false;
            }
            
            if (!senha || !senha.trim()) {
                showError('Preencha o campo de senha!');
                return false;
            }
            
            if (isLoading) return false;
            isLoading = true;
            
            const loginBtn = document.getElementById('doLoginBtn');
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Autenticando...';
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ 
                        login: login.trim(), 
                        senha: senha 
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Login bem-sucedido, redirecionar para o dashboard
                    window.location.href = '/dashboard';
                    return true;
                } else {
                    showError(data.message || 'Login ou senha inválidos!');
                    return false;
                }
            } catch (error) {
                console.error('Erro ao fazer login:', error);
                showError('Erro de conexão com o servidor! Verifique se o servidor está rodando em http://localhost:5000');
                return false;
            } finally {
                isLoading = false;
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> ACESSAR SISTEMA';
                }
            }
        }
        
        // ==================== EVENTOS DE CLIQUE E TECLA ====================
        const loginBtn = document.getElementById('doLoginBtn');
        if (loginBtn) {
            loginBtn.addEventListener('click', () => {
                const login = document.getElementById('loginUser')?.value || '';
                const senha = document.getElementById('loginPassword')?.value || '';
                fazerLogin(login, senha);
            });
        }
        
        const passwordInput = document.getElementById('loginPassword');
        if (passwordInput) {
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const login = document.getElementById('loginUser')?.value || '';
                    const senha = document.getElementById('loginPassword')?.value || '';
                    fazerLogin(login, senha);
                }
            });
        }
        
        const userInput = document.getElementById('loginUser');
        if (userInput) {
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const login = document.getElementById('loginUser')?.value || '';
                    const senha = document.getElementById('loginPassword')?.value || '';
                    fazerLogin(login, senha);
                }
            });
        }
        
        // ==================== VERIFICAR SE JÁ ESTÁ LOGADO ====================
        async function verificarSessao() {
            try {
                const response = await fetch('/api/usuario_atual', {
                    credentials: 'same-origin'
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.id && data.nome) {
                        // Usuário já está logado, redirecionar para o dashboard
                        window.location.href = '/dashboard';
                    }
                }
            } catch(e) {
                // Usuário não autenticado, permanece na página de login
                console.log('Usuário não autenticado');
            }
        }
        
        // ==================== INICIALIZAÇÃO ====================
        initTheme();
        verificarSessao();
        
        // Foco automático no campo de login
        setTimeout(() => {
            const loginField = document.getElementById('loginUser');
            if (loginField) loginField.focus();
        }, 2600);
    </script>
</body>
</html>
